<body class="account-page">

	<!-- Main Wrapper -->
	<div class="main-wrapper">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-5 mx-auto">
					<form action="#">
						<div class="d-flex flex-column justify-content-between vh-100">
							<div class=" mx-auto p-4 text-center">
								<img src="assets/img/logo.jpeg"
									class="img-fluid" width="70px" alt="Logo">
							</div>
							<div class="card">
								<div class="card-body p-4">
									<div class=" mb-4">
										<h2 class="mb-2">Welcome</h2>
										<p class="mb-0">Please enter your details to sign in</p>
									</div>
									<div class="mb-3 ">
										<label class="form-label"> User Name</label>
										<div class="input-icon mb-3 position-relative">
											<span class="input-icon-addon">
												<i class="ti ti-mail"></i>
											</span>
											<input type="text" value="" class="form-control">
										</div>
										<label class="form-label">Password</label>
										<div class="pass-group">
											<input type="password" class="pass-input form-control">
											<span class="ti toggle-password ti-eye-off"></span>
										</div>
									</div>

									<div class="form-wrap form-wrap-checkbox mb-3">
										<div class="d-flex align-items-center">
											<div class="form-check form-check-md mb-0">
												<input class="form-check-input mt-0" type="checkbox">
											</div>
											<p class="ms-1 mb-0 ">Remember Me</p>
										</div>
										<div class="text-end ">
											<a href="forgot-password.html" class="link-danger">Forgot
												Password?</a>
										</div>
									</div>
									<div class="mb-3">
										<a href="index.html" type="submit" class="btn btn-primary w-100">Sign In</a href="index.html">
									</div>
								</div>
							</div>
							<div class="p-4 text-center">
								<p class="mb-0 ">Copyright &copy; 2025 - Fabtech Campus</p>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
